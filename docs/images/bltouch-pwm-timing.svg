<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="530" viewBox="0 0 1100 530" role="img" aria-labelledby="title desc">
<title id="title">BLTouch PWM servo-style control pulses</title>
<desc id="desc">Two approximately twenty-millisecond frames, showing a narrow 650 microsecond pulse for deploy and a longer 1475 microsecond pulse for retract. Enlarged insets make pulse width differences visible.</desc>
<rect width="1100" height="530" fill="#fff"/>
<g font-family="DejaVu Sans,Arial,sans-serif" fill="#132d40">
<text x="46" y="48" font-size="30" font-weight="700">BLTouch control: pulse width carries the command</text>
<text x="46" y="78" font-size="17">Servo-compatible PWM (illustrative V3.x timings; exact values and tolerances vary by firmware and probe).</text>
<text x="47" y="143" font-size="21" font-weight="700">Deploy: M280 P0 S10</text>
<text x="47" y="254" font-size="21" font-weight="700">Retract: M280 P0 S90</text>
<g stroke="#d1dce2" stroke-dasharray="4 5"><path d="M170 111V320M900 111V320"/></g>
<g font-size="16" fill="#506473">
<text x="160" y="341">0 ms</text><text x="875" y="341">20 ms</text>
<text x="941" y="181">5 V or 3.3 V</text><text x="943" y="205">logic level</text><text x="941" y="294">GND</text>
</g>
<g fill="none" stroke="#168cba" stroke-width="5" stroke-linejoin="round" stroke-linecap="square">
<path d="M170 200V160H194V200H900"/>
<path d="M170 312V272H224V312H900"/>
</g>
<g font-size="16"><text x="180" y="152" fill="#12668e">~650 µs high</text><text x="205" y="265" fill="#12668e">~1475 µs high</text></g>
<path d="M170 355H900" stroke="#506473" stroke-width="1.6" />
<path d="M170 347V363M900 347V363" stroke="#506473" stroke-width="1.6"/>
<text x="510" y="381" font-size="17">Typical command frame ≈ 20 ms</text>
<rect x="48" y="408" width="1002" height="92" rx="10" fill="#eef4f8" stroke="#c9d9e1"/>
<text x="65" y="438" font-size="19" font-weight="700">What changes?</text>
<text x="65" y="465" font-size="18">The duration of the HIGH pulse—not simply a motor-style percentage duty cycle.</text>
<text x="65" y="489" font-size="15">The probe trigger on the separate Z-STOP line is a digital input and is not shown.</text>
</g>
</svg>